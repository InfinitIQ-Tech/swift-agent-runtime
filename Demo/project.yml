name: AgentRuntimeDemo
options:
  bundleIdPrefix: com.infinitiqtech
  deploymentTarget:
    iOS: '17.0'
    macOS: '15.0'
packages:
  Runtime:
    path: ..
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
    "CODE_SIGN_STYLE[sdk=macosx*]": Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MACOSX_DEPLOYMENT_TARGET: '15.0'
targets:
  AgentRuntimeDemo:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - Shared
      - path: ../Manifests/story-companion.agentconfig.json
        buildPhase: resources
    dependencies:
      - package: Runtime
        product: AgentRuntime
      - package: Runtime
        product: RuntimeDemoSupport
    settings:
      base:
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        PRODUCT_BUNDLE_IDENTIFIER: com.infinitiqtech.AgentRuntimeDemo
        PRODUCT_NAME: AgentRuntimeDemo
        INFOPLIST_KEY_CFBundleDisplayName: Runtime Demo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: '1,2'
  AgentRuntimeDemoUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [UITests]
    dependencies:
      - target: AgentRuntimeDemo
    settings:
      base:
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        PRODUCT_BUNDLE_IDENTIFIER: com.infinitiqtech.AgentRuntimeDemoUITests
        TEST_TARGET_NAME: AgentRuntimeDemo
        SUPPORTS_MACCATALYST: NO
schemes:
  AgentRuntimeDemo:
    build:
      targets:
        AgentRuntimeDemo: all
    test:
      targets: [AgentRuntimeDemoUITests]
      gatherCoverageData: false
